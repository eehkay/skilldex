# Skilldex Hub for Coolify (or plain docker compose).
#
# The hub shares the tailscale sidecar's network namespace and is published
# ONLY onto the tailnet via `tailscale serve` (see deploy/serve.json) — do not
# attach a public domain to this app in Coolify. The tailnet is the auth.
#
# Required environment (set in Coolify, value from Doppler delmar-shared/dev_personal):
#   TS_AUTHKEY  — a tailscale auth key for the hub node (tag it per your ACL)

services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: skillsync
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      # The image defaults to userspace networking, where inbound connections
      # never reach the shared netns — kernel mode is required for the hub's
      # port to be reachable at the node's tailnet address.
      - TS_USERSPACE=false
    volumes:
      - tailscale-state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  hub:
    build:
      context: .
    network_mode: service:tailscale
    environment:
      - SKILLDEX_DATA_DIR=/data
    volumes:
      - hub-data:/data
    depends_on:
      - tailscale
    restart: unless-stopped

volumes:
  tailscale-state:
  hub-data:
